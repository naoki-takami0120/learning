<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <article class="blog-card">
      <img class="blog-card__image" src="./assets/images/illustration-article.svg" alt="">
      <span class="blog-card__label">Learning</span>
      <time class="blog-card__date" datetime="2023-12-21">Published 21 Dec 2023</time>
      <h1 class="blog-card__title"><a href="#">HTML & CSS foundations</a></h1>
      <p class="blog-card__description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      <div class="blog-card__author">
        <img class="blog-card__avatar" src="./assets/images/image-avatar.webp" alt="">
        <span class="blog-card__author-name">Greg Hooper</span>
      </div>
    </article>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Naoki Takami</a>.
  </footer>
</body>
</html>
