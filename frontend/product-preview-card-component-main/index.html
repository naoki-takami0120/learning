<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <article class="perfume-card">
      <div class="perfume-card__image">
        <picture>
          <source srcset="./images/image-product-mobile.jpg" media="(max-width: 768px)">
          <img src="./images/image-product-desktop.jpg" alt="A CHANEL perfume product on a nice desk with leaves">
        </picture>
      </div>
      <div class="perfume-card__content">
        <p class="perfume-card__category">Perfume</p>
        <h1 class="perfume-card__title">Gabrielle Essence Eau De Parfum</h1>
        <p class="perfume-card__desc">
            A floral, solar and voluptuous interpretation composed by Olivier Polge, 
            Perfumer-Creator for the House of CHANEL.
        </p>
        <div class="perfume-card__price">
          <div class="perfume-card__sale-price">$149.99</div>
          <div class="perfume-card__original-price"><s>$169.99</s></div>
        </div>
        <button type="button" class="perfume-card__btn">
          <img src="./images/icon-cart.svg" alt="">
          Add to Cart
        </button>
      </div>
    </article>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/naoki-takami0120">Naoki Takami</a>.
  </footer>
</body>
</html>
